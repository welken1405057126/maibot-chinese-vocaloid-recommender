# 插件基础设置
[plugin]
enabled = true
config_version = "0.1.0"

# 作用范围配置
[scope]
# 允许使用插件的群号，字符串形式。空列表 = 不限制群；试运行时建议只填测试群。
allowed_group_ids = []
# 是否允许私聊使用
allow_private = true
# 是否全局共享曲库, global 为全局共享，group 为各群独立。
library_mode = "global"

# 权限配置
[permission]
# 全局管理员 QQ 号列表，字符串形式。空列表 = 无人拥有全局管理权。
global_admin_ids = []
# 是否允许管理员删除本群来源投稿
allow_group_admin_delete = true

# 推荐配置
[recommendation]
# 随机推荐时，最近 N 首不被使用
recent_exclusion_count = 5
# 播放量等元数据 N 天后刷新
metadata_refresh_days = 2

# 命令限流。限流记录保存在本地 SQLite，重启后仍然有效。
[rate_limit]
# 同一用户两次合法上传尝试的最短间隔秒数。
upload_cooldown_seconds = 60
# 同一用户按北京时间计算的每日成功收录上限。
upload_daily_limit = 10
# 同一聊天流每分钟最多受理的上传尝试数。
stream_upload_attempts_per_minute = 20
# 推荐命令冷却秒数（推荐命令接线后生效）。
recommend_cooldown_seconds = 5

# B 站只读请求配置。接口域名和请求头由代码固定，避免误配到其他主机。
[network]
# 一次上传或刷新流程的总超时秒数。
request_timeout_seconds = 12
# b23.tv 短链允许的最大跳转次数，每次跳转都会重新检查域名。
max_redirects = 3
# 视频元数据响应上限（字节），默认 2 MiB。
metadata_max_bytes = 2097152
# 单张封面响应上限（字节），默认 8 MiB。
max_cover_bytes = 8388608

# 封面缓存配置
[cover_cache]
# 后台清理任务的间隔小时数。
cleanup_interval_hours = 24
# 已删除投稿封面保留时间
deleted_retention_days = 30
# 无主封面的保留天数。
orphan_retention_days = 7
# 临时文件的保留小时数。
temp_retention_hours = 24
# 缓存总大小上限（MiB），超出后优先清理孤儿和软删除曲目的封面。
max_cache_mib = 256
